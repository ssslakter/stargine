[workspace]
preview = ["pixi-build"]
authors = ["Slava Chaunin <67190162+Ssslakter@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "https://conda.modular.com/max", "https://repo.prefix.dev/modular-community", "conda-forge"]
name = "stargine"
platforms = ["linux-64"]
version = "0.1.0"

[tasks.app]
cmd = "mojo main.mojo"
env = { ROOT_DIR = "./stargine", SDL_VIDEODRIVER="wayland" }

[tasks.test]
args = [{"arg"="folder"}]
cmd = "./tests/run_test.sh {{folder}}"

[dependencies]
mojo = "*"
opengl-mojo = {git = "https://github.com/ssslakter/opengl-mojo"}
sdl-mojo = {git = "https://github.com/ssslakter/sdl-mojo"}
ipykernel = ">=6.29.5,<7"
pillow = "*"
numpy = "*"